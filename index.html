<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Mis Finanzas</title>
<meta name="theme-color" content="#0f766e"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Finanzas"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#eef3f1;--c:#fff;--t:#10231e;--m:#5f726c;--p:#0f766e;--g:#15803d;--y:#ca8a04;--o:#ea580c;--r:#dc2626;--b:#d9e3df;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1512;--c:#13221d;--t:#e6f0ec;--m:#8aa39b;--b:#223630;--p:#2dd4bf}}
:root[data-theme="dark"]{--bg:#0a1512;--c:#13221d;--t:#e6f0ec;--m:#8aa39b;--b:#223630;--p:#2dd4bf}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px/1.4 system-ui,-apple-system,Roboto,'Segoe UI',sans-serif;padding-bottom:84px}
#app{max-width:520px;margin:auto;padding:14px}
h1{font-size:40px;margin:2px 0;letter-spacing:-1px}h2{font-size:17px;margin:20px 0 8px}h3{margin:0 0 10px}small,.m{color:var(--m)}
.card{background:var(--c);border:1px solid var(--b);border-radius:16px;padding:14px;margin-bottom:10px}
.hero{background:var(--p);color:#fff;border-radius:22px;padding:18px;margin-bottom:10px}.hero small{color:#d1fae5}
.sem{display:inline-block;background:#ffffff26;border-radius:99px;padding:4px 12px;font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .card{margin:0}.grid b{font-size:18px;display:block}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1;min-width:0}.sp b,.sp small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ic{font-size:22px;width:38px;height:38px;display:grid;place-items:center;background:var(--bg);border-radius:12px;flex:none}
.neg{color:var(--r)}.pos{color:var(--g)}
.bar{height:9px;background:var(--b);border-radius:9px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}.chip{border:1px solid var(--b);background:var(--c);color:var(--t);border-radius:99px;padding:8px 12px;font:inherit}.chip.on{background:var(--p);color:#fff;border-color:var(--p)}
button{font:inherit;cursor:pointer}.pri{width:100%;background:var(--p);color:#fff;border:0;border-radius:14px;padding:15px;font-weight:800;margin-top:6px}.sec{background:none;border:1px solid var(--b);color:var(--t);border-radius:12px;padding:9px 12px}.dng{color:var(--r)}
input,select{width:100%;font:inherit;padding:12px;border:1px solid var(--b);border-radius:12px;background:var(--c);color:var(--t);margin:4px 0 8px}
.big{font-size:32px;font-weight:800;text-align:center}label{font-size:13px;color:var(--m)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--c);border-top:1px solid var(--b);display:flex;justify-content:space-around;align-items:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{background:none;border:0;color:var(--m);font-size:11px;padding:4px 8px}nav button span{display:block;font-size:20px}nav .on{color:var(--p);font-weight:800}
nav .fab{background:var(--p);color:#fff;width:54px;height:54px;border-radius:50%;font-size:30px;margin-top:-26px;box-shadow:0 4px 14px #0004}
#mod{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;z-index:9}#mod.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:520px;margin:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto}
.demo{background:#fef3c7;color:#78350f;border-radius:12px;padding:8px 12px;margin-bottom:10px;font-weight:600}.demo a{text-decoration:underline}
.al{border-left:4px solid var(--o);padding:8px 10px;background:var(--c);border-radius:10px;margin-bottom:6px}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--t);color:var(--bg);padding:10px 16px;border-radius:12px;display:none;z-index:20}
.sc{max-height:55vh;overflow:auto}.q{display:flex;gap:8px;overflow:auto;margin-bottom:6px}.q button{white-space:nowrap}
button,.chip,.sec,.pri{min-height:44px}input,select{min-height:44px}html,body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent}body{-webkit-user-select:none;user-select:none}input{-webkit-user-select:text;user-select:text}nav button{min-height:48px;min-width:48px}
</style></head><body><div id="app"></div><nav id="nav"></nav><div id="mod"><div class="sheet" id="sh"></div></div><div id="toast"></div>
<script>
const K='fin_v1',$=s=>document.querySelector(s);
const EC={Alimentación:'🍎',Supermercado:'🛒',Combustible:'⛽',Vivienda:'🏠',Servicios:'💡',Educación:'🎓',Salud:'🏥',Transporte:'🚗',Comunicaciones:'📱',Familia:'👨‍👩‍👧',Entretenimiento:'🎉',Compras:'🛍️',Mantenimiento:'🔧',Trabajo:'💼',Otros:'📦'};
const IC={Sueldo:'💼',Negocio:'🏢',Alquiler:'🏠',Extraordinario:'💰',Otros:'📦'};
const TI={gasto:'💸',ingreso:'💵',transfer:'🔄',pago:'💰'};
const CUR={code:'PEN',sym:'S/'};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f=n=>CUR.sym+' '+(+n||0).toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2});
const iso=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10),today=()=>iso(new Date());
const sum=o=>Object.values(o).reduce((a,b)=>a+b,0);
function seed(){const d=n=>{const x=new Date();x.setDate(x.getDate()-n);return iso(x)};
return{ob:0,nid:20,
accounts:[{id:'a1',name:'BBVA',type:'banco',init:0},{id:'a2',name:'Efectivo',type:'efectivo',init:0}],
cards:[{id:'c1',name:'CMR Signature',limit:4500,init:1700,close:12,due:5},{id:'c2',name:'Scotiabank Oro',limit:5000,init:1800,close:10,due:6},{id:'c3',name:'BBVA Signature',limit:77900,init:0,close:10,due:5}],
budgets:{Educación:1250,Transporte:300,Comunicaciones:473,Entretenimiento:200,Servicios:250,Mantenimiento:100,Alimentación:800,Combustible:400,Salud:310,Supermercado:600,Otros:300},
tx:[{id:1,type:'ingreso',desc:'Sueldo',amt:6200,cat:'Sueldo',acc:'a1',date:d(1),demo:1},
{id:2,type:'gasto',desc:'Gasolina',amt:80,cat:'Combustible',acc:'a1',date:d(1),demo:1},
{id:3,type:'gasto',desc:'Supermercado',amt:300,cat:'Supermercado',card:'c3',date:d(0),demo:1},
{id:4,type:'transfer',desc:'Transferencia',amt:200,acc:'a1',to:'a2',date:d(0),demo:1},
{id:5,type:'gasto',desc:'Mercado',amt:60,cat:'Alimentación',acc:'a2',date:d(0),demo:1}]}}
let S=seed(),ready=0,DP,PEND,T='home',F=null,AK,AF,flt={p:'month',t:''};
let _db;const STORES=['accounts','cards','budgets','tx','meta'];
function idb(){return _db||(_db=new Promise((ok,no)=>{const q=indexedDB.open('misfinanzas',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)}))}
async function dbLoad(){const d=await idb();return new Promise((ok,no)=>{const st=d.transaction('kv').objectStore('kv'),o={};let n=0;STORES.forEach(k=>{const r=st.get(k);r.onsuccess=()=>{o[k]=r.result;if(++n==STORES.length)ok(o)};r.onerror=()=>no(r.error)})})}
async function dbSave(x){const d=await idb();return new Promise((ok,no)=>{const t=d.transaction('kv','readwrite'),st=t.objectStore('kv');st.put(x.accounts,'accounts');st.put(x.cards,'cards');st.put(x.budgets,'budgets');st.put(x.tx,'tx');st.put({ob:x.ob,nid:x.nid,currency:'PEN'},'meta');t.oncomplete=ok;t.onerror=()=>no(t.error)})}
const pack=o=>o&&o.meta&&o.accounts&&o.cards?{ob:o.meta.ob,nid:o.meta.nid,accounts:o.accounts,cards:o.cards,budgets:o.budgets||{},tx:o.tx||[]}:null;
function save(){if(!ready)return;dbSave(S).catch(()=>toast('No se pudo guardar en el teléfono. Exporta una copia.'))}
const r2=n=>Math.round(n*100)/100;
function calc(txs=S.tx){const bal={},used={};S.accounts.forEach(a=>bal[a.id]=a.init);S.cards.forEach(c=>used[c.id]=c.init);
txs.forEach(t=>{const m=t.amt;if(t.type=='gasto'){t.card?used[t.card]+=m:bal[t.acc]-=m}else if(t.type=='ingreso')bal[t.acc]+=m;else if(t.type=='transfer'){bal[t.acc]-=m;bal[t.to]+=m}else if(t.type=='pago'){used[t.card]-=m;bal[t.acc]-=m}});
for(const k in bal)bal[k]=r2(bal[k]);for(const k in used)used[k]=r2(used[k]);return{bal,used}}
function check(nt){const a=calc(),b=calc(nt);for(const x of S.accounts)if(b.bal[x.id]<-.005&&b.bal[x.id]<a.bal[x.id]-.005)return 'Saldo insuficiente en '+x.name;for(const c of S.cards){const u=b.used[c.id],p=a.used[c.id];if(u>c.limit+.005&&u>p+.005)return 'Supera la línea de '+c.name;if(u<-.005&&u<p-.005)return 'El pago supera la deuda de '+c.name}return ''}
function mst(ym=today().slice(0,7)){let inc=0,exp=0,cat={};S.tx.forEach(t=>{if(!t.date.startsWith(ym))return;if(t.type=='ingreso')inc+=t.amt;if(t.type=='gasto'){exp+=t.amt;cat[t.cat]=(cat[t.cat]||0)+t.amt}});return{inc,exp,cat}}
const col=p=>p>70?'var(--r)':p>50?'var(--o)':p>30?'var(--y)':'var(--g)';
const bar=(p,c)=>`<div class="bar"><i style="width:${Math.min(100,Math.max(0,p))}%;background:${c||col(p)}"></i></div>`;
const aName=id=>(S.accounts.find(a=>a.id==id)||{}).name||'?',cName=id=>(S.cards.find(a=>a.id==id)||{}).name||'?';
const dd=(y,m,d)=>new Date(y,m,Math.min(d,new Date(y,m+1,0).getDate()));
function daysTo(day){const n=new Date(),t0=new Date(n.getFullYear(),n.getMonth(),n.getDate());let d=dd(n.getFullYear(),n.getMonth(),day);if(d<t0)d=dd(n.getFullYear(),n.getMonth()+1,day);return Math.round((d-t0)/864e5)}
function stmt(c){const n=new Date(),t0=new Date(n.getFullYear(),n.getMonth(),n.getDate());let lc=dd(n.getFullYear(),n.getMonth(),c.close);if(lc>t0)lc=dd(n.getFullYear(),n.getMonth()-1,c.close);
let du=dd(lc.getFullYear(),lc.getMonth(),c.due);if(c.due<=c.close)du=dd(lc.getFullYear(),lc.getMonth()+1,c.due);
const ls=iso(lc);let ch=c.init,pg=0;S.tx.forEach(t=>{if(t.card!=c.id)return;if(t.type=='gasto'&&t.date<=ls)ch+=t.amt;if(t.type=='pago')pg+=t.amt});
return{amt:r2(Math.max(0,Math.min(ch-pg,calc().used[c.id]))),days:Math.round((du-t0)/864e5)}}
function toast(m){const e=$('#toast');e.textContent=m;e.style.display='block';setTimeout(()=>e.style.display='none',3600)}
function showM(h){$('#sh').innerHTML=h;$('#mod').classList.add('on')}function closeM(){$('#mod').classList.remove('on')}
$('#mod').onclick=e=>{if(e.target.id=='mod')closeM()};
function R(){$('#app').innerHTML=({home,cards,stats,more,mov,acc,bud})[T]();
const nb=(k,i,l)=>`<button class="${T==k?'on':''}" onclick="go('${k}')"><span>${i}</span>${l}</button>`;
$('#nav').innerHTML=nb('home','🏠','Inicio')+nb('mov','📋','Movimientos')+'<button class="fab" onclick="menu()">+</button>'+nb('cards','💳','Tarjetas')+nb('stats','📊','Análisis')+nb('more','⚙️','Más')}
function go(t){T=t;R();scrollTo(0,0)}
function txRow(t){const neg=t.type=='gasto',s=t.type=='gasto'?(t.card?'💳 '+cName(t.card):'🏦 '+aName(t.acc)):t.type=='ingreso'?'🏦 '+aName(t.acc):t.type=='transfer'?aName(t.acc)+' → '+aName(t.to):'💳 '+cName(t.card)+' ← '+aName(t.acc);
const cl=neg?'neg':t.type=='ingreso'?'pos':'m';
return `<div class="card row" onclick="txAct(${t.id})"><div class="ic">${(neg?EC[t.cat]:t.type=='ingreso'?IC[t.cat]:null)||TI[t.type]}</div><div class="sp"><b>${esc(t.desc)}${t.demo?' <small>(demo)</small>':''}</b><small>${t.date} · ${s}</small></div><b class="${cl}">${neg?'-':t.type=='ingreso'?'+':''}${f(t.amt)}</b></div>`}
function alerts(bal,used,m){const a=[];Object.entries(S.budgets).forEach(([k,v])=>{const g=m.cat[k]||0;if(v>0&&g>v)a.push(`🔴 ${k}: superaste el presupuesto (${f(g)} de ${f(v)})`);else if(v>0&&g>=.8*v)a.push(`🟠 ${k}: ${Math.round(g/v*100)}% del presupuesto`)});
S.cards.forEach(c=>{const p=used[c.id]/c.limit*100;if(p>70)a.push(`💳 ${c.name} al ${Math.round(p)}% de uso`);{const q=stmt(c);if(q.amt>0&&q.days<=5)a.push(`📅 ${q.days<0?'Pago vencido':'Pago'} de ${c.name}: ${f(q.amt)} ${q.days<0?'hace '+(-q.days):'en '+q.days} día(s)`)}});
S.accounts.forEach(x=>{if(bal[x.id]<100)a.push(`⚠️ Saldo bajo en ${x.name}: ${f(bal[x.id])}`)});return a}
function home(){const{bal,used}=calc(),av=sum(bal),debt=sum(used),m=mst(),bt=sum(S.budgets),bs=Object.keys(S.budgets).reduce((a,k)=>a+(m.cat[k]||0),0),pct=bt?bs/bt*100:0,mu=Math.max(0,...S.cards.map(c=>used[c.id]/c.limit*100));
const st=(pct>100||mu>70||av<0)?2:(pct>80||mu>50||av<debt)?1:0,al=alerts(bal,used,m);
const q=[['⛽','Gasolina','Combustible'],['🛒','Supermercado','Supermercado'],['🍽️','Restaurante','Alimentación'],['🏫','Colegio','Educación'],['📱','Celular','Comunicaciones']];
const pays=S.cards.map(c=>[stmt(c),c]).filter(x=>x[0].amt>0).sort((a,b)=>a[0].days-b[0].days);
return `${S.tx.some(t=>t.demo)?'<div class="demo">DATOS DE DEMOSTRACIÓN · <a onclick="clearDemo()">borrarlos</a></div>':''}
<div class="hero"><small>Dinero real disponible</small><h1>${f(av)}</h1><span class="sem">${['🟢 Saludable','🟡 Atención','🔴 Riesgo'][st]}</span></div>
<div class="q">${q.map(x=>`<button class="chip" onclick="openForm('gasto',{desc:'${x[1]}',cat:'${x[2]}'})">${x[0]} ${x[1]}</button>`).join('')}</div>
<div class="grid"><div class="card"><small>Ingresos</small><b class="pos">${f(m.inc)}</b></div><div class="card"><small>Gastos</small><b class="neg">${f(m.exp)}</b></div><div class="card"><small>Ahorro</small><b>${f(m.inc-m.exp)}</b></div><div class="card"><small>Deuda de tarjetas</small><b>${f(debt)}</b></div></div>
<div class="card" style="margin-top:10px"><div class="row"><small class="sp">Presupuesto restante</small><b>${f(bt-bs)}</b></div>${bar(pct)}<small>${Math.round(pct)}% usado de ${f(bt)}${m.exp>bs+.005?' · Sin presupuesto: '+f(m.exp-bs):''}</small></div>
${al.length?'<h2>Alertas</h2>'+al.map(x=>`<div class="al">${x}</div>`).join(''):''}
${pays.length?'<h2>Próximos pagos</h2>'+pays.map(([q,c])=>`<div class="card row"><div class="ic">📅</div><div class="sp"><b>${esc(c.name)}</b><small>Vence día ${c.due} · ${q.days<0?'vencido hace '+(-q.days):'en '+q.days} día(s)</small></div><b>${f(q.amt)}</b></div>`).join(''):''}
<h2>Últimos movimientos</h2>${[...S.tx].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id).slice(0,5).map(txRow).join('')||'<p class="m">Aún no hay movimientos. Toca + para registrar el primero.</p>'}`}
function cards(){const{used}=calc();return `<h2 style="margin-top:4px">Mis tarjetas</h2>`+S.cards.map(c=>{const u=used[c.id],p=u/c.limit*100,q=stmt(c);
return `<div class="card"><div class="row"><b class="sp">${esc(c.name)}</b><b>${Math.round(p)}%</b></div>${bar(p)}
<div class="grid" style="gap:6px"><small>Línea<b>${f(c.limit)}</b></small><small>Usado<b>${f(u)}</b></small><small>Disponible<b>${f(c.limit-u)}</b></small><small>Estado<b>${u<=0?'Al día':q.amt>0&&q.days<0?'Vencido':q.amt>0&&q.days<=5?'Pago próximo':'Con deuda'}</b></small></div>
<p class="m">Cierre día ${c.close} · Vence día ${c.due} · Pago del estado de cuenta: ${q.amt>0?f(q.amt)+(q.days<0?' (vencido)':' en '+q.days+' día(s)'):'—'}</p>
<div class="row"><button class="sec sp" onclick="openForm('pago',{card:'${c.id}',amt:${(q.amt||Math.max(0,u)).toFixed(2)}})">💰 Pagar</button><button class="sec sp" onclick="editCard('${c.id}')">✏️ Editar</button></div></div>`}).join('')+`<button class="sec" onclick="editCard()">+ Nueva tarjeta</button>`}
function stats(){const m=mst(),tot=m.exp||1,ms=[...Array(4)].map((_,i)=>{const d=new Date();d.setMonth(d.getMonth()-3+i,1);return iso(d).slice(0,7)}),data=ms.map(k=>[k,mst(k)]),mx=Math.max(1,...data.map(([,x])=>Math.max(x.inc,x.exp))),{used}=calc();
return `<h2 style="margin-top:4px">Gastos del mes por categoría</h2><div class="card">${Object.entries(m.cat).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div><div class="row"><span class="sp">${EC[k]} ${k}</span><b>${f(v)}</b></div>${bar(v/tot*100,'var(--p)')}</div>`).join('')||'<p class="m">Sin gastos este mes.</p>'}</div>
<h2>Ingresos vs gastos</h2><div class="card">${data.map(([k,x])=>`<div><small>${k}</small>${bar(x.inc/mx*100,'var(--g)')}${bar(x.exp/mx*100,'var(--r)')}<small>+${f(x.inc)} · -${f(x.exp)}</small></div>`).join('')}</div>
<h2>Uso de tarjetas</h2><div class="card">${S.cards.map(c=>{const p=used[c.id]/c.limit*100;return `<div class="row"><span class="sp">${esc(c.name)}</span><b>${Math.round(p)}%</b></div>${bar(p)}`}).join('')}</div>`}
function more(){const b=(i,l,a)=>`<button class="card row" style="width:100%;color:inherit;text-align:left" onclick="${a}"><div class="ic">${i}</div><b>${l}</b></button>`;
return `<h2 style="margin-top:4px">Configuración</h2>${DP?b('📲','Instalar Mis Finanzas','DP.prompt()'):''}${b('🏦','Mis cuentas',"go('acc')")}${b('🎯','Presupuestos',"go('bud')")}${b('📆','Fechas y líneas de tarjetas',"go('cards')")}${b('⬇️','Exportar copia de seguridad','exportData()')}${b('⬆️','Importar copia de seguridad','importPick()')}${b('🧹','Borrar datos de demostración','clearDemo()')}${b('⚠️','Eliminar todos los datos','wipeAsk()')}<p class="m">Tus datos se guardan solo en este teléfono y no se envían a ningún servidor. Exporta una copia con frecuencia. Moneda: PEN.</p>`}
function mov(){const cur=today().slice(0,7),pv=(()=>{const d=new Date();d.setMonth(d.getMonth()-1,1);return iso(d).slice(0,7)})(),m3=(()=>{const d=new Date();d.setMonth(d.getMonth()-2,1);return iso(d)})();
const ok=t=>(flt.t?t.type==flt.t:1)&&({today:t.date==today(),month:t.date.startsWith(cur),prev:t.date.startsWith(pv),m3:t.date>=m3,year:t.date.startsWith(cur.slice(0,4)),all:1}[flt.p]);
const L=S.tx.filter(ok).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id),op=(o,v,l)=>`<option value="${v}" ${o==v?'selected':''}>${l}</option>`;
return `<h2 style="margin-top:4px">Movimientos</h2><div class="grid"><select onchange="flt.p=this.value;R()">${op(flt.p,'today','Hoy')}${op(flt.p,'month','Este mes')}${op(flt.p,'prev','Mes anterior')}${op(flt.p,'m3','Últimos 3 meses')}${op(flt.p,'year','Este año')}${op(flt.p,'all','Todo')}</select><select onchange="flt.t=this.value;R()">${op(flt.t,'','Todos')}${op(flt.t,'gasto','Gastos')}${op(flt.t,'ingreso','Ingresos')}${op(flt.t,'transfer','Transferencias')}${op(flt.t,'pago','Pagos de tarjeta')}</select></div><div style="margin-top:10px">${L.map(txRow).join('')||'<p class="m">Sin movimientos en este filtro.</p>'}</div>`}
